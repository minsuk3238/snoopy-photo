<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스누피 코믹스트립 만들기</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cropper.js (사진 자르기 라이브러리) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- html2canvas (이미지 저장 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 구글 폰트 (만화 손글씨 느낌) -->
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f5;
            font-family: 'Gaegu', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 만화책 영문 폰트 */
        .comic-font {
            font-family: 'Architects Daughter', cursive;
        }

        /* * [디자인 설명]
         * Peanuts(스누피) 코믹스의 특유의 삐뚤빼뚤한 선을 표현하기 위한 테두리 설정입니다.
         * border-radius에 여러 값을 주어 손으로 그린 듯한 느낌을 냅니다.
         */
        .hand-drawn-border {
            border: 4px solid #1a1a1a;
            border-radius: 2px 255px 3px 25px / 255px 5px 225px 3px;
        }

        /* * [말풍선 덧씌우기(Overlay) 핵심 로직]
         * pointer-events: none; 을 주어 말풍선 위를 터치해도
         * 그 아래에 있는 사진 레이어(업로드 버튼)가 눌리도록 합니다.
         */
        .overlay-layer {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        /* 사진이 들어가는 배경 레이어 */
        .photo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            object-fit: cover;
            object-position: center;
        }

        /* 사용자가 지정한 프레임 이미지 스타일 (Layer 2) */
        .frame-image {
            width: 100%;
            height: 100%;
            object-fit: fill; /* 프레임 비율에 맞게 꽉 채움 */
            pointer-events: none; /* 클릭 방해 금지 */
        }

        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- 상단 안내 (사용자에게 시각적 설명을 제공) -->
    <div class="text-center mb-6 max-w-md w-full">
        <h1 class="text-3xl font-bold mb-2">나만의 야외가든 코믹스트립</h1>
        <p class="text-gray-600 text-sm bg-white p-3 rounded-lg shadow-sm border border-gray-200">
            각 프레임을 터치하여 사진을 넣으세요.<br>
            투명한 프레임 아래로 사진이 합성됩니다.
        </p>
    </div>

    <!-- 4컷 만화 컨테이너 (가로 스크롤 1열 4칸 배열로 복구) -->
    <div class="w-full max-w-4xl overflow-x-auto no-scrollbar pb-6">
        <!-- 캡처될 실제 만화 영역 -->
        <div id="comic-strip" class="flex gap-2 w-max px-4 bg-white p-4 border border-gray-200 shadow-lg mx-auto">
            
            <!-- 프레임 1 -->
            <div class="relative w-[240px] h-[280px] bg-gray-100 cursor-pointer overflow-hidden shrink-0 border border-gray-300" onclick="document.getElementById('file-1').click()">
                <!-- Layer 1: 업로드되는 사진 (가장 바닥) -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10" id="placeholder-1">
                    <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="text-sm">사진 넣기</span>
                </div>
                <img id="photo-1" class="photo-layer hidden" alt="패널 1 사진">
                
                <!-- Layer 2: 사용자 지정 프레임 이미지 오버레이 (사진 위에 덧씌워짐) -->
                <div class="overlay-layer">
                    <img src="frame1.png" alt="프레임 1 배경" class="frame-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InRyYW5zcGFyZW50IiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iNCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iYXJpYWwiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiMzMzMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkZyYW1lIDE8L3RleHQ+PC9zdmc+'">
                </div>
                <!-- onclick="this.value=null" 속성을 추가하여 같은 파일을 다시 선택해도 작동하도록 수정 -->
                <input type="file" id="file-1" class="hidden" accept="image/*" onclick="this.value=null" onchange="handleFileSelect(event, 1)">
            </div>

            <!-- 프레임 2 -->
            <div class="relative w-[240px] h-[280px] bg-gray-100 cursor-pointer overflow-hidden shrink-0 border border-gray-300" onclick="document.getElementById('file-2').click()">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10" id="placeholder-2">
                    <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="text-sm">사진 넣기</span>
                </div>
                <img id="photo-2" class="photo-layer hidden" alt="패널 2 사진">
                
                <!-- Layer 2 -->
                <div class="overlay-layer">
                    <img src="frame2.png" alt="프레임 2 배경" class="frame-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InRyYW5zcGFyZW50IiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iNCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iYXJpYWwiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiMzMzMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkZyYW1lIDI8L3RleHQ+PC9zdmc+'">
                </div>
                <input type="file" id="file-2" class="hidden" accept="image/*" onclick="this.value=null" onchange="handleFileSelect(event, 2)">
            </div>

            <!-- 프레임 3 -->
            <div class="relative w-[240px] h-[280px] bg-gray-100 cursor-pointer overflow-hidden shrink-0 border border-gray-300" onclick="document.getElementById('file-3').click()">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10" id="placeholder-3">
                    <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="text-sm">사진 넣기</span>
                </div>
                <img id="photo-3" class="photo-layer hidden" alt="패널 3 사진">
                
                <!-- Layer 2 -->
                <div class="overlay-layer">
                    <img src="frame3.png" alt="프레임 3 배경" class="frame-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InRyYW5zcGFyZW50IiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iNCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iYXJpYWwiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiMzMzMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkZyYW1lIDM8L3RleHQ+PC9zdmc+'">
                </div>
                <input type="file" id="file-3" class="hidden" accept="image/*" onclick="this.value=null" onchange="handleFileSelect(event, 3)">
            </div>

            <!-- 프레임 4 -->
            <div class="relative w-[240px] h-[280px] bg-gray-100 cursor-pointer overflow-hidden shrink-0 border border-gray-300" onclick="document.getElementById('file-4').click()">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10" id="placeholder-4">
                    <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="text-sm">사진 넣기</span>
                </div>
                <img id="photo-4" class="photo-layer hidden" alt="패널 4 사진">
                
                <!-- Layer 2 -->
                <div class="overlay-layer">
                    <img src="frame4.png" alt="프레임 4 배경" class="frame-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InRyYW5zcGFyZW50IiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iNCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iYXJpYWwiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiMzMzMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkZyYW1lIDQ8L3RleHQ+PC9zdmc+'">
                </div>
                <input type="file" id="file-4" class="hidden" accept="image/*" onclick="this.value=null" onchange="handleFileSelect(event, 4)">
            </div>

        </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="mt-4 w-full max-w-sm sm:max-w-md px-4 pb-12">
        <button onclick="saveComicStrip()" class="w-full bg-green-600 text-white font-bold text-xl py-4 rounded-xl shadow-lg hover:bg-green-700 transition active:scale-95 flex justify-center items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            완성된 작품 저장하기
        </button>
        <p class="text-center text-gray-500 text-sm mt-3">4칸을 모두 채운 뒤 저장 버튼을 눌러주세요!</p>
    </div>

    <!-- 사진 크롭 모달 -->
    <div id="cropper-modal" class="fixed inset-0 bg-black z-50 hidden flex-col">
        <div class="flex justify-between items-center p-4 bg-gray-900 text-white">
            <button onclick="closeCropper()" class="p-2 font-bold text-gray-300">취소</button>
            <h2 class="text-lg font-bold">사진 맞추기</h2>
            <button onclick="applyCrop()" class="p-2 text-green-400 font-bold">완료</button>
        </div>
        <!-- 크롭퍼 영역 -->
        <div class="flex-1 overflow-hidden bg-black relative flex items-center justify-center">
            <img id="image-to-crop" src="" class="max-w-full max-h-full">
            
            <!-- 사용자 이해를 돕기 위한 모달 내 안내 메시지 -->
            <div class="absolute bottom-10 left-0 w-full text-center pointer-events-none z-10">
                <span class="bg-black/70 text-white px-4 py-2 rounded-full text-sm font-bold">
                    손가락으로 확대/축소 및 이동해주세요
                </span>
            </div>
        </div>
    </div>

    <script>
        let cropper = null;
        let currentPanel = 1; // 현재 작업 중인 패널 번호 (1~4)

        // 파일 선택 시 실행
        function handleFileSelect(event, panelNumber) {
            const file = event.target.files[0];
            if (!file) return;

            currentPanel = panelNumber; // 몇 번째 칸을 수정 중인지 저장
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const imageToCrop = document.getElementById('image-to-crop');
                imageToCrop.src = e.target.result;
                
                // 모달을 먼저 엽니다.
                openCropperModal();
                
                // 기존 크롭퍼가 있다면 파괴
                if (cropper) { cropper.destroy(); }
                
                // [버그 수정] 모달이 화면에 완전히 표시(display:flex)될 시간을 준 뒤 크롭퍼 실행
                setTimeout(() => {
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 240 / 280, // 패널 디자인 비율
                        viewMode: 1, // 자르기 상자가 캔버스를 벗어나지 않게
                        dragMode: 'move', // 사진을 이동시킬 수 있도록
                        background: false,
                        guides: true,
                        autoCropArea: 1,
                        zoomable: true
                    });
                }, 100);
            };
            
            reader.readAsDataURL(file);
        }

        // 모달 열기
        function openCropperModal() {
            document.getElementById('cropper-modal').classList.remove('hidden');
            document.getElementById('cropper-modal').classList.add('flex');
            document.body.style.overflow = 'hidden'; // 뒤 배경 스크롤 방지
        }

        // 모달 닫기
        function closeCropper() {
            document.getElementById('cropper-modal').classList.add('hidden');
            document.getElementById('cropper-modal').classList.remove('flex');
            document.body.style.overflow = '';
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        // 크롭 완료 후 이미지 적용
        function applyCrop() {
            if (!cropper) return;
            
            // 크롭된 이미지를 캔버스로 추출
            const canvas = cropper.getCroppedCanvas({
                width: 480, // 고해상도 저장을 위해 크기 설정
                height: 560
            });
            
            // Base64 데이터로 변환
            const croppedImageDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // 해당 패널의 이미지(Layer 1)에 적용
            const photoEl = document.getElementById(`photo-${currentPanel}`);
            photoEl.src = croppedImageDataUrl;
            photoEl.classList.remove('hidden');
            
            // '사진 넣기' 텍스트 숨김
            document.getElementById(`placeholder-${currentPanel}`).classList.add('hidden');
            
            closeCropper();
        }

        // 최종 만화 저장 (html2canvas)
        function saveComicStrip() {
            let isAllFilled = true;
            for(let i=1; i<=4; i++) {
                if(document.getElementById(`photo-${i}`).classList.contains('hidden')) {
                    isAllFilled = false;
                }
            }
            
            if(!isAllFilled) {
                const proceed = confirm('아직 채워지지 않은 칸이 있습니다. 그래도 저장하시겠습니까?');
                if(!proceed) return;
            }

            const comicStripElement = document.getElementById('comic-strip');
            
            // 가로 스크롤 레이아웃 캡처 버그(잘림 현상) 방지를 위한 임시 스크롤 초기화
            const originalScroll = comicStripElement.parentElement.scrollLeft;
            comicStripElement.parentElement.scrollLeft = 0;
            
            // 화면 크기가 작아졌더라도 고해상도로 캡처하기 위해 scale을 높임 (scale: 3)
            html2canvas(comicStripElement, {
                scale: 3, 
                backgroundColor: '#ffffff',
                useCORS: true // 외부 폰트 렌더링 지원
            }).then(canvas => {
                // 다운로드 링크 생성
                const link = document.createElement('a');
                link.download = '나만의_야외가든_만화.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                
                // 캡처 완료 후 스크롤 원복
                comicStripElement.parentElement.scrollLeft = originalScroll;
            });
        }
    </script>
</body>
</html>
